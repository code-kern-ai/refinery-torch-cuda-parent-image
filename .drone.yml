kind: pipeline
type: docker
name: amd64

platform:
  arch: amd64

steps:
  - name: submodules
    image: alpine/git
    commands:
      - git submodule init
      - 'git config --global url."https://github.com/".insteadOf git@github.com:'
      - "git submodule update --recursive"
  - name: build and publish
    image: plugins/docker:21
    depends_on:
      - submodules
    settings:
      platform: linux/amd64
      registry: registry.dev.kern.ai
      username:
        from_secret: docker_username
      password:
        from_secret: docker_password
      base_image_registry: dhi.io
      base_image_username:
        from_secret: dockerhub_username
      base_image_password:
        from_secret: dockerhub_password
      repo: "registry.dev.kern.ai/code-kern-ai/refinery-parent-images"
      tags: ["${DRONE_COMMIT_SHA}-torch-cuda", "${DRONE_COMMIT_BRANCH}-torch-cuda"]
      cache_from:
        - "registry.dev.kern.ai/code-kern-ai/refinery-parent-images:dev-torch-cuda"
        - "registry.dev.kern.ai/code-kern-ai/refinery-parent-images:${DRONE_COMMIT_BRANCH}-torch-cuda"

trigger:
  event:
    - push

---
kind: pipeline
type: docker
name: amd64-dockerhub

platform:
  arch: amd64

steps:
  - name: submodules
    image: alpine/git
    commands:
      - git submodule init
      - 'git config --global url."https://github.com/".insteadOf git@github.com:'
      - "git submodule update --recursive"
  - name: build and publish
    image: plugins/docker:21
    depends_on:
      - submodules
    settings:
      platform: linux/amd64
      username:
        from_secret: dockerhub_username
      password:
        from_secret: dockerhub_password
      base_image_registry: dhi.io
      base_image_username:
        from_secret: dockerhub_username
      base_image_password:
        from_secret: dockerhub_password
      repo: "kernai/refinery-parent-images"
      tag: "${DRONE_TAG}-torch-cuda-drone-amd64"

trigger:
  event:
    - tag

---
kind: pipeline
name: manifest
steps:
  - name: manifest
    image: plugins/manifest
    settings:
      spec: manifest.tmpl
      username:
        from_secret: dockerhub_username
      password:
        from_secret: dockerhub_password

depends_on:
  - amd64-dockerhub

trigger:
  event:
    - tag
